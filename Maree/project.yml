name: Maree
options:
  bundleIdPrefix: fr.lemairepro
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Keeps LastUpgradeCheck current so Xcode stops proposing its settings upgrade.
  xcodeVersion: "26.6"

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    # Xcode recommended settings (the .xcodeproj is regenerated, so they live here).
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Free-provisioning signing (Personal Team), so regeneration keeps device deploys working.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: QWT44GPUUT

targets:
  Maree:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lemairepro.maree
        INFOPLIST_KEY_CFBundleDisplayName: Marée
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent
        # This toolchain's Info.plist synthesis silently drops
        # INFOPLIST_KEY_UILaunchScreen_UIColorName (absent from its hardcoded key
        # list, unlike _Generation — verified against the built Info.plist and the
        # key list in SWBCore). INFOPLIST_FILE merges in the one key it can't
        # synthesise; see Support/LaunchScreenInfo.plist.
        INFOPLIST_FILE: Support/LaunchScreenInfo.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [MareeTests]

  MareeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Maree
      - package: GRDB
    scheme:
      testTargets: [MareeTests]

schemes:
  # Device deployment: Release build on iPhone; the plain Maree scheme stays Debug.
  Maree Release:
    build:
      targets:
        Maree: all
    run:
      config: Release
