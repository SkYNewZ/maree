name: Maree
options:
  bundleIdPrefix: fr.lemairepro
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES

targets:
  Maree:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lemairepro.maree
        INFOPLIST_KEY_CFBundleDisplayName: Marée
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        # XcodeGen defaults application targets to ASSETCATALOG_COMPILER_APPICON_NAME
        # = AppIcon, which only bites once an asset catalogue exists (added by task
        # 2, the Theme palette). No AppIcon set exists yet — task 6 adds it.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets: [MareeTests]

  MareeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Maree
      - package: GRDB
    scheme:
      testTargets: [MareeTests]
